<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener('error', function (event) {
        var msg = event && (event.message || (event.error && event.error.message) || '');
        if (typeof msg === 'string' && (msg.indexOf('ResizeObserver loop') !== -1 || msg.indexOf('WebSocket closed without opened') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var msg = event && event.reason && (event.reason.message || String(event.reason));
        if (typeof msg === 'string' && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1 || msg.indexOf('ResizeObserver loop') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
